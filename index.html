<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boing Max Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        :root {
            --ora: #E8650A; --ora2: #F5A05A; --ora-light: #FEF3EB;
            --grn: #52B043; --dark: #1A1A1A; --gray1: #F7F7F5; --gray2: #EDEDE9;
            --text: #1A1A1A; --white: #fff; --radius: 14px; --nav-h: 68px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--gray1); color: var(--text); padding-bottom: 80px; }
        
        .topbar { background: var(--ora); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-txt { font-family: 'Fredoka One', cursive; font-size: 20px; }
        .sync-box { display: flex; align-items: center; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 14px; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 8px; }
        .sync-dot.loading { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .container { padding: 15px; max-width: 650px; margin: auto; }
        .card { background: white; border-radius: var(--radius); padding: 18px; margin-bottom: 15px; border: 1px solid var(--gray2); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .card-title { font-weight: 800; font-size: 15px; margin-bottom: 12px; color: var(--text); }
        
        .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill { padding: 10px 16px; border-radius: 99px; background: var(--gray1); border: 2px solid var(--gray2); cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.2s; }
        .pill.active { background: var(--ora); color: white; border-color: var(--ora); }

        .grid-tienda { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-tienda { background: var(--white); border: 2px solid var(--gray2); padding: 12px; border-radius: 10px; text-align: left; cursor: pointer; }
        .btn-tienda:active { background: var(--ora-light); }
        .price-tag { color: var(--ora); font-weight: 800; }

        .total-banner { background: var(--ora-light); padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .btn-registrar { width: 100%; background: var(--ora); color: white; border: none; padding: 16px; border-radius: 10px; font-family: 'Fredoka One', cursive; font-size: 18px; cursor: pointer; margin-top: 15px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--dark); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #888; text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; border: none; background: none; flex: 1; }
        .nav-item.active { color: var(--ora2); }
        
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo-txt">🎪 Boing Max</div>
    <div class="sync-box">
        <div id="sync-dot" class="sync-dot"></div>
        <div id="display-total-hoy">$0 hoy</div>
    </div>
</div>

<div class="container">
    <div id="view-entrada" class="view active">
        <div class="card">
            <div class="card-title">⏱️ Tipo de entrada</div>
            <div id="list-tiempos" class="pill-group"></div>
        </div>
        
        <div class="card">
            <div class="card-title">🧦 Medias (opcional)</div>
            <div id="list-medias" class="pill-group"></div>
        </div>

        <div class="card">
            <div class="card-title">💳 Método de Pago</div>
            <div class="pill-group">
                <div class="pill active" onclick="setPago('Efectivo', this)">💵 Efectivo</div>
                <div class="pill" onclick="setPago('Transferencia', this)">📱 Transferencia</div>
            </div>
            <div class="total-banner">
                <span style="font-weight: 800; color: var(--ora);">TOTAL A COBRAR:</span>
                <span id="label-total" style="font-size: 28px; font-weight: 800; color: var(--ora);">$0</span>
            </div>
            <button class="btn-registrar" onclick="registrarVenta()">✓ Registrar entrada</button>
        </div>
    </div>

    <div id="view-tienda" class="view">
        <div class="card">
            <div class="card-title">🥤 Bebidas y Snacks</div>
            <div id="grid-bebidas" class="grid-tienda"></div>
        </div>
        <div class="card">
            <div class="card-title">🚀 Juguetes</div>
            <div id="grid-juguetes" class="grid-tienda"></div>
        </div>
    </div>

    <div id="view-dash" class="view">
        <div class="card">
            <div class="card-title">📊 Ventas de Hoy</div>
            <canvas id="chartHoy"></canvas>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="v('entrada', this)"><span>➕</span>Entrada</button>
    <button class="nav-item" onclick="v('tienda', this)"><span>🛒</span>Tienda</button>
    <button class="nav-item" onclick="v('dash', this)"><span>📊</span>Dash</button>
    <button class="nav-item" onclick="location.reload()"><span>🔄</span>Sinc</button>
</nav>

<script>
// URL CORREGIDA CON COMILLAS (IMPORTANTE)
const GS_URL = "https://script.google.com/macros/s/AKfycbxvbaaqCrDd31B38loDWIXpBulnB76aCsLHbitkXyIMKzsNht1yhE2EGhKJM1B8-x8B/exec";

let CONFIG = {
    tiempos: [
        {n: "1 hora", p: 20000}, {n: "30 minutos", p: 15000},
        {n: "Promo 2x1", p: 30000}, {n: "Promo Martes", p: 40000}
    ],
    medias: [
        {n: "XS", p: 3000}, {n: "S", p: 3000}, {n: "M", p: 3000}, {n: "L", p: 3000}
    ],
    tienda: [
        {cat: "b", n: "Agua", p: 2500}, {cat: "b", n: "Gaseosa", p: 3500},
        {cat: "j", n: "Burbujas", p: 5000}, {cat: "j", n: "Pelota", p: 8000}
    ]
};

let actual = { tiempo: null, media: null, pago: 'Efectivo' };

window.onload = () => {
    render();
    actualizarTotalHoy();
};

function render() {
    document.getElementById('list-tiempos').innerHTML = CONFIG.tiempos.map(t => `<div class="pill" onclick="selT(this, '${t.n}', ${t.p})">${t.n} — $${t.p.toLocaleString()}</div>`).join('');
    document.getElementById('list-medias').innerHTML = CONFIG.medias.map(m => `<div class="pill" onclick="selM(this, '${m.n}', ${m.p})">${m.n}</div>`).join('');
    
    document.getElementById('grid-bebidas').innerHTML = CONFIG.tienda.filter(x=>x.cat==='b').map(i => `<div class="btn-tienda" onclick="vDirecta('${i.n}', ${i.p})"><b>${i.n}</b><br><span class="price-tag">$${i.p.toLocaleString()}</span></div>`).join('');
    document.getElementById('grid-juguetes').innerHTML = CONFIG.tienda.filter(x=>x.cat==='j').map(i => `<div class="btn-tienda" onclick="vDirecta('${i.n}', ${i.p})"><b>${i.n}</b><br><span class="price-tag">$${i.p.toLocaleString()}</span></div>`).join('');
}

function selT(el, n, p) {
    document.querySelectorAll('#list-tiempos .pill').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    actual.tiempo = {n, p}; calc();
}

function selM(el, n, p) {
    if(el.classList.contains('active')){ el.classList.remove('active'); actual.media = null; }
    else {
        document.querySelectorAll('#list-medias .pill').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        actual.media = {n, p};
    }
    calc();
}

function setPago(tipo, el) {
    actual.pago = tipo;
    el.parentNode.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
}

function calc() {
    let total = (actual.tiempo?.p || 0) + (actual.media?.p || 0);
    document.getElementById('label-total').textContent = "$" + total.toLocaleString();
}

async function registrarVenta() {
    if(!actual.tiempo) return alert("Selecciona una entrada");
    const total = (actual.tiempo.p) + (actual.media ? actual.media.p : 0);
    await enviar({ hoja: "Transacciones", fila: [new Date().toLocaleDateString(), new Date().toLocaleTimeString(), "Entrada", actual.tiempo.n + (actual.media?" + Medias":""), actual.pago, total] });
}

async function vDirecta(n, p) {
    if(confirm(`¿Vender ${n}?`)) await enviar({ hoja: "Transacciones", fila: [new Date().toLocaleDateString(), new Date().toLocaleTimeString(), "Tienda", n, "Efectivo", p] });
}

async function enviar(datos) {
    document.getElementById('sync-dot').className = "sync-dot loading";
    try {
        await fetch(GS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(datos) });
        alert("¡Registrado!"); location.reload();
    } catch(e) { alert("Error"); }
}

async function actualizarTotalHoy() {
    try {
        const r = await fetch(GS_URL + "?hoja=Transacciones");
        const d = await r.json();
        let h = new Date().toLocaleDateString(), s = 0;
        d.filas.forEach(f => { if(f[0] === h) s += parseFloat(f[5] || 0); });
        document.getElementById('display-total-hoy').textContent = "$" + s.toLocaleString() + " hoy";
    } catch(e) {}
}

function v(view, btn) {
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    document.getElementById('view-'+view).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
}
</script>
</body>
</html>
