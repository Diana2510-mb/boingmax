<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Boing Max Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        :root {
            --ora: #E8650A; --ora2: #F5A05A; --ora-light: #FEF3EB;
            --grn: #52B043; --grn-light: #EDF7EB;
            --dark: #1A1A1A; --gray1: #F7F7F5; --gray2: #EDEDE9;
            --text: #1A1A1A; --text2: #6B6B60; --white: #fff;
            --radius: 14px; --radius-sm: 10px; --nav-h: 65px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Nunito', sans-serif; background: var(--gray1); color: var(--text); padding-bottom: 80px; }
        
        /* Estilos de la barra superior */
        .topbar { background: var(--ora); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sync-dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; margin-right: 5px; }
        .sync-dot.loading { background: #fbbf24; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Contenedores */
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; border-radius: var(--radius); padding: 20px; margin-bottom: 15px; border: 1px solid var(--gray2); }
        .card-title { font-family: 'Fredoka One', cursive; font-size: 18px; margin-bottom: 15px; color: var(--ora); }

        /* Botones y Píldoras */
        .pill-group { display: flex; flex-wrap: wrap; gap: 10px; }
        .pill { padding: 12px 18px; border-radius: 99px; background: var(--gray1); border: 2px solid var(--gray2); cursor: pointer; font-weight: 700; transition: 0.2s; }
        .pill.active { background: var(--ora); color: white; border-color: var(--ora); }
        .btn-main { width: 100%; padding: 15px; border-radius: var(--radius-sm); border: none; background: var(--ora); color: white; font-family: 'Fredoka One', cursive; font-size: 18px; cursor: pointer; margin-top: 10px; }

        /* Navegación inferior */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--dark); display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; border: none; background: none; }
        .nav-item.active { color: var(--ora2); }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div class="topbar">
    <div style="font-family: 'Fredoka One';">BOING MAX 🎪</div>
    <div style="display: flex; align-items: center;">
        <div id="sync-status" class="sync-dot"></div>
        <div id="total-dia-hoy" style="font-weight: 800;">$0 hoy</div>
    </div>
</div>

<div class="container">
    <div id="view-registro" class="view active">
        <div class="card">
            <div class="card-title">Seleccionar Entrada</div>
            <div id="entradas-list" class="pill-group"></div>
        </div>
        <div class="card">
            <div class="card-title">¿Lleva Medias?</div>
            <div id="medias-list" class="pill-group">
                <div class="pill" onclick="toggleMedias(this)">SÍ (Medias)</div>
            </div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span>Total a cobrar:</span>
                <span id="label-total" style="font-size: 24px; font-weight: 800; color: var(--ora);">$0</span>
            </div>
            <button class="btn-main" onclick="registrarVenta()">REGISTRAR ENTRADA</button>
        </div>
    </div>

    <div id="view-dash" class="view">
        <div class="card">
            <div class="card-title">Ventas de la Semana</div>
            <canvas id="ventasChart"></canvas>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="changeView('registro', this)"><span>➕</span>Entrada</button>
    <button class="nav-item" onclick="changeView('dash', this)"><span>📊</span>Dash</button>
    <button class="nav-item" onclick="window.location.reload()"><span>🔄</span>Refrescar</button>
</nav>

<script>
    // 1. PEGA TU URL DE GOOGLE SCRIPT AQUÍ
    const GS_URL = " https://script.google.com/macros/s/AKfycbxvbaaqCrDd31B38loDWIXpBulnB76aCsLHbitkXyIMKzsNht1yhE2EGhKJM1B8-x8B/exec";

    let CONFIG = {
        entradas: [
            {nombre: "1 Hora", precio: 12000},
            {nombre: "30 Min", precio: 7000},
            {nombre: "Promo 2x1", precio: 15000}
        ],
        precioMedias: 3000
    };

    let ventaActual = { entrada: null, medias: false };

    // FUNCIÓN CARGAR DATOS AL ABRIR
    window.onload = async () => {
        renderEntradas();
        await actualizarDatosDesdeSheets();
    };

    async function actualizarDatosDesdeSheets() {
        const dot = document.getElementById('sync-status');
        dot.className = "sync-dot loading";
        
        try {
            const res = await fetch(GS_URL + "?hoja=Transacciones");
            const data = await res.json();
            
            let sumaHoy = 0;
            let fechaHoy = new Date().toLocaleDateString();
            
            data.filas.forEach(fila => {
                if (fila[0] === fechaHoy) {
                    sumaHoy += parseFloat(fila[5] || 0);
                }
            });
            
            document.getElementById('total-dia-hoy').textContent = "$" + sumaHoy.toLocaleString() + " hoy";
            dot.className = "sync-dot";
        } catch (e) {
            console.error(e);
            dot.style.background = "red";
        }
    }

    function renderEntradas() {
        const cont = document.getElementById('entradas-list');
        cont.innerHTML = CONFIG.entradas.map((e, index) => `
            <div class="pill" onclick="selectEntrada(this, ${index})">${e.nombre}</div>
        `).join('');
    }

    function selectEntrada(el, index) {
        document.querySelectorAll('#entradas-list .pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        ventaActual.entrada = CONFIG.entradas[index];
        calcularTotal();
    }

    function toggleMedias(el) {
        ventaActual.medias = !ventaActual.medias;
        el.classList.toggle('active');
        calcularTotal();
    }

    function calcularTotal() {
        let total = (ventaActual.entrada?.precio || 0) + (ventaActual.medias ? CONFIG.precioMedias : 0);
        document.getElementById('label-total').textContent = "$" + total.toLocaleString();
    }

    async function registrarVenta() {
        if (!ventaActual.entrada) return alert("Selecciona una entrada");
        
        const total = (ventaActual.entrada.precio) + (ventaActual.medias ? CONFIG.precioMedias : 0);
        const registro = {
            hoja: "Transacciones",
            encabezados: ["Fecha", "Hora", "Tipo", "Detalle", "Pago", "Total"],
            fila: [new Date().toLocaleDateString(), new Date().toLocaleTimeString(), "Entrada", ventaActual.entrada.nombre, "Efectivo", total]
        };

        document.getElementById('sync-status').className = "sync-dot loading";
        
        await fetch(GS_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(registro)
        });

        alert("¡Venta registrada!");
        location.reload(); // Recarga para actualizar el total de la barra superior
    }

    function changeView(view, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        btn.classList.add('active');
    }
</script>

</body>
</html>
